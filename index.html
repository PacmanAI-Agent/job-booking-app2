<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Booking</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<img src="logo.png" alt="App logo" class="logo">
<h1>Job Booking</h1>
  </header>

<main>
<form id="bookingForm">
<!-- Fixed Company Name -->
<input type="hidden" id="company" name="Company" value="Arkwright's Freight Ltd">
<p style="font-weight: bold; text-align:center; margin-top:0.5rem;">Arkwright's Freight Ltd</p>

<div id="jobs-container">
  <!-- Job template - first job -->
  <div class="job-entry">
    <h3>Job #1</h3>
    
    <label for="destination_1">Company Destination</label>
    <input type="text" id="destination_1" name="Destination" placeholder="e.g. 123 Main St" required>

    <label for="address_1">Address (optional)</label>
    <input type="text" id="address_1" name="Address" placeholder="e.g. Suite 5, 456 Oak Ave">

    <label for="description_1">Description</label>
    <textarea id="description_1" name="Description" rows="3" placeholder="Job details" required></textarea>

    <div class="checkboxes">
      <label><input type="checkbox" name="PickUp" value="Yes"> Pick-up</label>
      <label><input type="checkbox" name="DropOff" value="Yes"> Drop-off</label>
    </div>

    <label for="phone_1">Phone (optional)</label>
    <input type="tel" id="phone_1" name="Phone" placeholder="e.g. 022 370 3540">

    <label for="attachments_1">Attachments (photos / docs)</label>
    <input type="file" id="attachments_1" name="Attachments" accept="image/*,application/pdf" multiple>
  </div>
</div>

<!-- Date selector (shared for all jobs) -->
<label for="date-picker">Date</label>
<input type="date" id="date-picker" name="Date" required>

<div class="button-row">
  <button type="button" id="addJobBtn" class="secondary">+ Add Another Job</button>
</div>

<button type="submit">Book All Jobs</button>
</form>

<section id="status"></section>
</main>

<script src="script.js"></script>
</body>
</html>
